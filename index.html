const gl=()=>{try{return localStorage.getItem('rou-lang')}catch{return null}};
async function getUsers(){return(await dbget('users'))||[]}
async function hp(p,salt){try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:120000,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b)).join(',')}catch{let h=5381;for(const c of p+salt.join(''))h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}}
function authUI(){let mode='login',un='';const o=ov('');o.style.zIndex=100;o.style.background='radial-gradient(circle at 50% 30%,#3a0d24,#0c0308)';
 const draw=()=>{o.innerHTML=`<div class="glass fm center" style="max-width:420px"><h1 class=serif style="font-size:36px">${D.cfg.app} <span class=beat>❤️</span></h1><p class=serif style="font-style:italic;opacity:.85;margin:0">${t('a_sub')}</p>
 <select id=al>${LANGS.map(l=>`<option value=${l[0]} ${l[0]===S.cfg.lang?'selected':''}>${l[1]}</option>`).join('')}</select>
 <div class=row><button class="btn${mode==='login'?'':'2'}" id=tl>${t('a_login')}</button><button class="btn${mode==='reg'?'':'2'}" id=tr>${t('a_create')}</button></div>
 <label>${t('a_user')}<input id=au autocomplete=username value="${esc(un)}"></label><label>${t('a_pass')}<input id=ap type=password autocomplete="${mode==='reg'?'new-password':'current-password'}"></label>${mode==='reg'?`<label>${t('a_pass2')}<input id=ap2 type=password autocomplete=new-password></label>`:''}
 <p id=ae style="color:#ff8fab;min-height:1.2em;margin:0;font-size:14px"></p><button class=btn id=ago>${mode==='login'?t('a_login'):t('a_create')}</button><p style="font-size:12px;opacity:.6;margin:0">${t('a_note')}</p></div>`;
  const keep=()=>un=$('#au').value;
  $('#al').onchange=e=>{keep();S.cfg.lang=e.target.value;try{localStorage.setItem('rou-lang',S.cfg.lang)}catch{}document.documentElement.lang=S.cfg.lang;draw()};
  $('#tl').onclick=()=>{keep();mode='login';draw()};$('#tr').onclick=()=>{keep();mode='reg';draw()};
  $('#ago').onclick=submit;o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')submit()})};
 const submit=async()=>{const name=$('#au').value.trim(),pw=$('#ap').value,id=name.toLowerCase(),err=m=>{$('#ae').textContent=t(m)};un=name;const us=await getUsers();
  if(mode==='login'){const u=us.find(x=>x.id===id);if(!u||await hp(pw,u.salt)!==u.hash)return err('a_bad');UID=id}
  else{if(name.length<2)return err('a_short_u');if(pw.length<4)return err('a_short_p');if(pw!==$('#ap2').value)return err('a_match');if(us.some(x=>x.id===id))return err('a_exists');

   if(us.length===1)for(const k of KEYS){const v=await dbget(k);if(v!==undefined)await dbset('u:'+id+':'+k,v)}
   await dbset('users',us);UID=id}
  try{localStorage.setItem('rou-user',UID)}catch{}
  o.remove();const lg=S.cfg.lang;S={mem:[],cfg:{lang:lg},reasons:[],env:[],words:[],song:null};enter()};
 draw()}
